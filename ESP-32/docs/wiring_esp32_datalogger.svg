  <!-- ==================== FOOTER LEGEND ==================== -->
  <rect x="30" y="882" width="1380" height="58" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="50" y="906" fill="#0f172a" font-size="12.5" font-weight="700">LEGENDA &amp; CATATAN PENTING:</text>
