<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 960" width="1440" height="960" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1440" height="960" fill="#f8fafc"/>

  <!-- Header -->
  <rect x="20" y="16" width="1400" height="62" rx="10" fill="#0f172a"/>
  <text x="42" y="45" fill="#ffffff" font-size="22" font-weight="700">WIRING DIAGRAM: ESP32 30-PIN DATA LOGGER 4-20mA + LCD I2C + JOYSTICK + SCADA STB</text>
  <text x="42" y="66" fill="#94a3b8" font-size="13">Semua input analog menggunakan ADC1 (GPIO 32, 33, 34) agar aman saat Wi-Fi/MQTT EMQX aktif | Joystick VCC wajib 3.3V</text>

  <!-- ==================== LEFT COLUMN ==================== -->

  <!-- PSU 12V & Motherboard Expansion -->
  <rect x="30" y="100" width="350" height="190" rx="10" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <rect x="30" y="100" width="350" height="34" rx="10" fill="#334155"/>
  <rect x="30" y="120" width="350" height="14" fill="#334155"/>
  <text x="45" y="123" fill="#ffffff" font-size="14" font-weight="700">1. PSU 12V &amp; MOTHERBOARD EXPANSION</text>
  <text x="45" y="158" fill="#1e293b" font-size="13" font-weight="600">Input PSU 12V DC (Barrel Jack / Terminal)</text>
  <text x="45" y="178" fill="#475569" font-size="12">Regulator on-board menurunkan 12V -> 5V &amp; 3.3V</text>
  <rect x="45" y="194" width="320" height="82" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="58" y="216" fill="#b91c1c" font-size="12" font-weight="700">Rail 12V : ke Konverter 4-20mA VCC (jika 12V)</text>
  <text x="58" y="236" fill="#c2410c" font-size="12" font-weight="700">Rail 5V  : ke ESP32 VIN &amp; LCD 16x2 I2C VCC</text>
  <text x="58" y="256" fill="#a16207" font-size="12" font-weight="700">Rail 3.3V: ke Joystick Analog VCC (WAJIB 3.3V)</text>
  <text x="58" y="272" fill="#0f172a" font-size="12" font-weight="700">GND      : Common Ground semua modul</text>

  <!-- Sensor 4-20mA & PSU 24V / Signal Generator -->
  <rect x="30" y="315" width="350" height="225" rx="10" fill="#ffffff" stroke="#0369a1" stroke-width="2"/>
  <rect x="30" y="315" width="350" height="34" rx="10" fill="#0369a1"/>
  <rect x="30" y="335" width="350" height="14" fill="#0369a1"/>
  <text x="45" y="338" fill="#ffffff" font-size="14" font-weight="700">2. SENSOR KUALITAS AIR 4-20mA / SIG-GEN</text>
  <text x="45" y="372" fill="#0f172a" font-size="13" font-weight="600">Mode Lapangan (Sensor + PSU Loop 24V DC):</text>
  <text x="45" y="392" fill="#334155" font-size="12">• +24V DC -> Sensor V+ (atau +Loop)</text>
  <text x="45" y="410" fill="#334155" font-size="12">• Sensor Out (4-20mA) -> IN+ Konverter</text>
  <text x="45" y="428" fill="#334155" font-size="12">• 0V PSU 24V -> IN- Konverter &amp; Common GND</text>
  <rect x="45" y="445" width="320" height="80" rx="6" fill="#e0f2fe" stroke="#38bdf8"/>
  <text x="56" y="466" fill="#0369a1" font-size="12" font-weight="700">Mode Uji / Kalibrasi (Signal Generator 4-20mA):</text>
  <text x="56" y="485" fill="#0c4a6e" font-size="12">• I+ Signal Gen -> IN+ Konverter</text>
  <text x="56" y="503" fill="#0c4a6e" font-size="12">• I- Signal Gen -> IN- Konverter</text>
  <text x="56" y="520" fill="#0c4a6e" font-size="11">(Pastikan mode generator sesuai: Active/Passive loop)</text>

  <!-- Converter Module 4-20mA to 0-3.3V -->
  <rect x="30" y="565" width="350" height="260" rx="10" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
  <rect x="30" y="565" width="350" height="34" rx="10" fill="#b91c1c"/>
  <rect x="30" y="585" width="350" height="14" fill="#b91c1c"/>
  <text x="45" y="588" fill="#ffffff" font-size="14" font-weight="700">3. KONVERTER 4-20mA KE 0-3.3V</text>

  <!-- Terminals inside Converter -->
  <rect x="45" y="612" width="130" height="28" rx="4" fill="#fee2e2" stroke="#ef4444"/>
  <text x="55" y="630" fill="#7f1d1d" font-size="12" font-weight="700">IN+ (4-20mA)</text>

  <rect x="45" y="648" width="130" height="28" rx="4" fill="#f1f5f9" stroke="#64748b"/>
  <text x="55" y="666" fill="#1e293b" font-size="12" font-weight="700">IN- (Loop GND)</text>

  <rect x="235" y="612" width="130" height="28" rx="4" fill="#ffedd5" stroke="#f97316"/>
  <text x="245" y="630" fill="#9a3412" font-size="12" font-weight="700">VCC (12V/5V)</text>

  <rect x="235" y="648" width="130" height="28" rx="4" fill="#f1f5f9" stroke="#475569"/>
  <text x="245" y="666" fill="#0f172a" font-size="12" font-weight="700">GND</text>

  <rect x="235" y="684" width="130" height="28" rx="4" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
  <text x="245" y="702" fill="#991b1b" font-size="12" font-weight="700">VOUT (0-3.3V)</text>

  <!-- Safety Warning Box -->
  <rect x="45" y="726" width="320" height="86" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="56" y="746" fill="#92400e" font-size="12" font-weight="700">WAJIB SEBELUM COLOK KE GPIO 34:</text>
  <text x="56" y="764" fill="#78350f" font-size="11.5">1. Injeksi 20.00 mA dari Signal Generator.</text>
  <text x="56" y="781" fill="#78350f" font-size="11.5">2. Ukur VOUT pakai Multimeter, putar trimmer SPAN</text>
  <text x="56" y="798" fill="#78350f" font-size="11.5">   sampai VOUT &lt;= 3.0V - 3.1V (MAX AMAN 3.3V!).</text>

  <!-- ==================== CENTER COLUMN: ESP32 30-PIN ==================== -->
  <rect x="490" y="105" width="380" height="720" rx="14" fill="#1e293b" stroke="#0f172a" stroke-width="3"/>
  <rect x="615" y="116" width="130" height="32" rx="5" fill="#475569"/>
  <text x="680" y="137" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">USB / SILICON</text>
  <text x="680" y="172" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle">ESP32 DEVKIT V1</text>
  <text x="680" y="192" fill="#38bdf8" font-size="13" font-weight="600" text-anchor="middle">(Varian 30-Pin / Motherboard)</text>

  <!-- Left Pins (15 pins) y starts 228 step 36 -->
  <g font-size="12" font-weight="600">
    <rect x="502" y="214" width="108" height="26" rx="4" fill="#334155"/><text x="512" y="231" fill="#cbd5e1">EN</text>
    <rect x="502" y="250" width="108" height="26" rx="4" fill="#334155"/><text x="512" y="267" fill="#cbd5e1">VP (GPIO36)</text>
    <rect x="502" y="286" width="108" height="26" rx="4" fill="#334155"/><text x="512" y="303" fill="#cbd5e1">VN (GPIO39)</text>

    <!-- D34 Active -->
    <rect x="502" y="322" width="128" height="26" rx="4" fill="#dc2626" stroke="#fca5a5"/><text x="512" y="339" fill="#ffffff">D34 (ADC1_6)</text>

    <rect x="502" y="358" width="108" height="26" rx="4" fill="#334155"/><text x="512" y="375" fill="#cbd5e1">D35 (GPIO35)</text>

    <!-- D32 Active -->
    <rect x="502" y="394" width="128" height="26" rx="4" fill="#2563eb" stroke="#93c5fd"/><text x="512" y="411" fill="#ffffff">D32 (ADC1_4)</text>

    <!-- D33 Active -->
    <rect x="502" y="430" width="128" height="26" rx="4" fill="#0891b2" stroke="#67e8f9"/><text x="512" y="447" fill="#ffffff">D33 (ADC1_5)</text>

    <!-- D25 Active -->
    <rect x="502" y="466" width="128" height="26" rx="4" fill="#7c3aed" stroke="#c4b5fd"/><text x="512" y="483" fill="#ffffff">D25 (GPIO25)</text>

    <rect x="502" y="502" width="108" height="26" rx="4" fill="#334155"/><text x="512" y="519" fill="#cbd5e1">D26</text>
    <rect x="502" y="538" width="108" height="26" rx="4" fill="#334155"/><text x="512" y="555" fill="#cbd5e1">D27</text>
    <rect x="502" y="574" width="108" height="26" rx="4" fill="#334155"/><text x="512" y="591" fill="#cbd5e1">D14</text>
    <rect x="502" y="610" width="108" height="26" rx="4" fill="#334155"/><text x="512" y="627" fill="#cbd5e1">D12</text>
    <rect x="502" y="646" width="108" height="26" rx="4" fill="#334155"/><text x="512" y="663" fill="#cbd5e1">D13</text>

    <!-- GND Left -->
    <rect x="502" y="682" width="108" height="26" rx="4" fill="#0f172a" stroke="#94a3b8"/><text x="512" y="699" fill="#ffffff">GND</text>
    <!-- VIN Left -->
    <rect x="502" y="718" width="108" height="26" rx="4" fill="#ea580c" stroke="#fed7aa"/><text x="512" y="735" fill="#ffffff">VIN (5V)</text>
  </g>

  <!-- Right Pins (15 pins) y starts 214 step 36 -->
  <g font-size="12" font-weight="600" text-anchor="end">
    <rect x="750" y="214" width="108" height="26" rx="4" fill="#334155"/><text x="848" y="231" fill="#cbd5e1">D23</text>

    <!-- D22 SCL -->
    <rect x="730" y="250" width="128" height="26" rx="4" fill="#16a34a" stroke="#86efac"/><text x="848" y="267" fill="#ffffff">D22 (I2C SCL)</text>

    <rect x="750" y="286" width="108" height="26" rx="4" fill="#334155"/><text x="848" y="303" fill="#cbd5e1">TX0</text>
    <rect x="750" y="322" width="108" height="26" rx="4" fill="#334155"/><text x="848" y="339" fill="#cbd5e1">RX0</text>

    <!-- D21 SDA -->
    <rect x="730" y="358" width="128" height="26" rx="4" fill="#ea580c" stroke="#fdba74"/><text x="848" y="375" fill="#ffffff">D21 (I2C SDA)</text>

    <rect x="750" y="394" width="108" height="26" rx="4" fill="#334155"/><text x="848" y="411" fill="#cbd5e1">D19</text>
    <rect x="750" y="430" width="108" height="26" rx="4" fill="#334155"/><text x="848" y="447" fill="#cbd5e1">D18</text>
    <rect x="750" y="466" width="108" height="26" rx="4" fill="#334155"/><text x="848" y="483" fill="#cbd5e1">D5</text>
    <rect x="750" y="502" width="108" height="26" rx="4" fill="#334155"/><text x="848" y="519" fill="#cbd5e1">TX2 (17)</text>
    <rect x="750" y="538" width="108" height="26" rx="4" fill="#334155"/><text x="848" y="555" fill="#cbd5e1">RX2 (16)</text>
    <rect x="750" y="574" width="108" height="26" rx="4" fill="#334155"/><text x="848" y="591" fill="#cbd5e1">D4</text>
    <rect x="750" y="610" width="108" height="26" rx="4" fill="#334155"/><text x="848" y="627" fill="#cbd5e1">D2 (LED)</text>
    <rect x="750" y="646" width="108" height="26" rx="4" fill="#334155"/><text x="848" y="663" fill="#cbd5e1">D15</text>

    <!-- GND Right -->
    <rect x="750" y="682" width="108" height="26" rx="4" fill="#0f172a" stroke="#94a3b8"/><text x="848" y="699" fill="#ffffff">GND</text>
    <!-- 3V3 Right -->
    <rect x="730" y="718" width="128" height="26" rx="4" fill="#ca8a04" stroke="#fde047"/><text x="848" y="735" fill="#ffffff">3V3 (3.3V OUT)</text>
  </g>

  <!-- Inner Note Box inside ESP32 -->
  <rect x="520" y="762" width="320" height="48" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="680" y="783" fill="#94a3b8" font-size="11.5" text-anchor="middle">NVS Flash menyimpan kalibrasi 2-titik &amp; Loop mV</text>
  <text x="680" y="800" fill="#38bdf8" font-size="11.5" text-anchor="middle">Wi-Fi STA -&gt; EMQX Port 1883 (datalogger/wq01/#)</text>

  <!-- ==================== RIGHT COLUMN ==================== -->

  <!-- LCD 16x2 I2C -->
  <rect x="1030" y="105" width="380" height="225" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="1030" y="105" width="380" height="34" rx="10" fill="#16a34a"/>
  <rect x="1030" y="125" width="380" height="14" fill="#16a34a"/>
  <text x="1045" y="128" fill="#ffffff" font-size="14" font-weight="700">4. LCD 16x2 + I2C BACKPACK (PCF8574)</text>

  <rect x="1195" y="152" width="195" height="65" rx="6" fill="#14532d" stroke="#22c55e" stroke-width="2"/>
  <text x="1208" y="178" fill="#bbf7d0" font-size="13" font-family="Consolas, monospace">pH  :  7.02 pH</text>
  <text x="1208" y="202" fill="#bbf7d0" font-size="13" font-family="Consolas, monospace">12.02mA   MQ:OK</text>

  <g font-size="12" font-weight="700">
    <rect x="1045" y="152" width="125" height="26" rx="4" fill="#ffedd5" stroke="#f97316"/><text x="1055" y="169" fill="#9a3412">VCC (5V)</text>
    <rect x="1045" y="186" width="125" height="26" rx="4" fill="#f1f5f9" stroke="#475569"/><text x="1055" y="203" fill="#0f172a">GND</text>
    <rect x="1045" y="220" width="125" height="26" rx="4" fill="#ffedd5" stroke="#ea580c"/><text x="1055" y="237" fill="#9a3412">SDA (D21)</text>
    <rect x="1045" y="254" width="125" height="26" rx="4" fill="#dcfce7" stroke="#16a34a"/><text x="1055" y="271" fill="#14532d">SCL (D22)</text>
  </g>
  <text x="1045" y="308" fill="#475569" font-size="11.5">Alamat I2C default: 0x27 (atau 0x3F jika blank)</text>

  <!-- Joystick Analog -->
  <rect x="1030" y="360" width="380" height="255" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="1030" y="360" width="380" height="34" rx="10" fill="#2563eb"/>
  <rect x="1030" y="380" width="380" height="14" fill="#2563eb"/>
  <text x="1045" y="383" fill="#ffffff" font-size="14" font-weight="700">5. JOYSTICK ANALOG (NAVIGASI MENU)</text>

  <g font-size="12" font-weight="700">
    <rect x="1045" y="408" width="145" height="26" rx="4" fill="#fef9c3" stroke="#ca8a04"/><text x="1055" y="425" fill="#854d0e">VCC (WAJIB 3.3V)</text>
    <rect x="1045" y="442" width="145" height="26" rx="4" fill="#f1f5f9" stroke="#475569"/><text x="1055" y="459" fill="#0f172a">GND</text>
    <rect x="1045" y="476" width="145" height="26" rx="4" fill="#dbeafe" stroke="#2563eb"/><text x="1055" y="493" fill="#1e40af">VRX (D32 / ADC1)</text>
    <rect x="1045" y="510" width="145" height="26" rx="4" fill="#cffafe" stroke="#0891b2"/><text x="1055" y="527" fill="#155e75">VRY (D33 / ADC1)</text>
    <rect x="1045" y="544" width="145" height="26" rx="4" fill="#ede9fe" stroke="#7c3aed"/><text x="1055" y="561" fill="#5b21b6">SW  (D25 / Pullup)</text>
  </g>
  <rect x="1205" y="408" width="190" height="162" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="1215" y="430" fill="#1e3a8a" font-size="12" font-weight="700">Kontrol Menu LCD:</text>
  <text x="1215" y="452" fill="#1e40af" font-size="11.5">• Tekan SW : Menu/Simpan</text>
  <text x="1215" y="472" fill="#1e40af" font-size="11.5">• Tahan SW : Batal/Keluar</text>
  <text x="1215" y="492" fill="#1e40af" font-size="11.5">• VRY Atas/Bwh : Scroll /</text>
  <text x="1215" y="508" fill="#1e40af" font-size="11.5">  Ubah nilai kalibrasi</text>
  <text x="1215" y="528" fill="#1e40af" font-size="11.5">• VRX Kiri/Kanan : Ubah</text>
  <text x="1215" y="544" fill="#1e40af" font-size="11.5">  step (0.01/0.1/1/10)</text>
  <text x="1045" y="598" fill="#b91c1c" font-size="11.5" font-weight="700">Catatan: Jangan suplai Joystick VCC ke 5V!</text>

  <!-- STB SCADA Box -->
  <rect x="1030" y="645" width="380" height="180" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <rect x="1030" y="645" width="380" height="34" rx="10" fill="#7c3aed"/>
  <rect x="1030" y="665" width="380" height="14" fill="#7c3aed"/>
  <text x="1045" y="668" fill="#ffffff" font-size="14" font-weight="700">6. STB SERVER (EMQX + NODE-RED + TAILSCALE)</text>
  <text x="1045" y="702" fill="#0f172a" font-size="12" font-weight="600">• EMQX Broker : Port 1883 (LAN Wi-Fi lokal)</text>
  <text x="1045" y="724" fill="#0f172a" font-size="12" font-weight="600">• Node-RED SCADA : Dashboard + CSV Data Logger</text>
  <text x="1045" y="746" fill="#0f172a" font-size="12" font-weight="600">• Tailscale VPN : Akses aman Node-RED dari luar</text>
  <text x="1045" y="776" fill="#475569" font-size="11.5">Topik Telemetry : datalogger/wq01/telemetry</text>
  <text x="1045" y="794" fill="#475569" font-size="11.5">Topik Kalibrasi : datalogger/wq01/calibration/set</text>
  <text x="1045" y="812" fill="#475569" font-size="11.5">Topik Konfirmasi: datalogger/wq01/calibration/status</text>

  <!-- ==================== WIRING PATHS ==================== -->

  <!-- Sensor / Signal Gen -> Converter IN+ / IN- -->
  <path d="M 30 405 L 18 405 L 18 626 L 45 626" fill="none" stroke="#0369a1" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 30 426 L 10 426 L 10 662 L 45 662" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

